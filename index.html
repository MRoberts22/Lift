.wkc .yt{position:absolute;left:0;top:-18px;font:600 var(--fs-cap) var(--fd);color:var(--sub)}
.ygrid{position:absolute;left:0;right:0;top:0;height:var(--th)}
.gl{position:absolute;left:34px;right:0;border-top:1px solid var(--line);height:0}
.gl span{position:absolute;left:-34px;top:-7px;width:28px;text-align:right;font:600 var(--fs-cap) var(--fd);color:var(--sub)}
.wkc .dcols{height:auto;margin-top:0;position:relative}
.dcol .trk{flex:none;height:var(--th)}
.dcol .cap{height:calc(var(--th)*var(--r))!important;min-height:12px}
.xt{text-align:center;font:600 var(--fs-cap) var(--fd);color:var(--sub);margin-top:var(--s3)}
.dcol.sel:not(.now) .dn{color:var(--tx)}
/* heatmap axes */
.hmw{display:grid;grid-template-columns:30px 1fr;gap:var(--s3)}
.hmy{display:grid;grid-template-rows:repeat(7,20px);gap:var(--s2);margin-top:var(--s7);font:600 var(--fs-cap) var(--fd);color:var(--sub);align-items:center}
.hmx{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--s2);height:16px;font:600 var(--fs-cap) var(--fd);color:var(--sub)}
.hmx span{white-space:nowrap;overflow:visible}
.hm{margin-top:var(--s2)}
/* weight box turns green after an increase */
.sc.up{background:color-mix(in srgb,var(--c-arms) 14%,var(--cell))}
.sc.up .k,.sc.up .v,.sc.up .v small,.sc.up .v svg{color:var(--grn)}
/* finished workouts fade but stay readable */
.ex .ex-m,.ex .ic,.ex .strip,.ex .sc{transition:opacity .35s ease}
.ex.dn{background:color-mix(in srgb,var(--card) 62%,var(--bg))}
.ex.dn .ex-s b,.ex.dn .sc:not(.up):not(.go) .v{color:var(--sub)}
.ex.dn .ic{opacity:.5}   /* a finished workout goes quiet: grey text, a more recessed card, a dimmed info icon. Text is faded by COLOR, never by opacity, so it stays readable (WCAG AA, enforced by the visual audit). The check circle is left alone so it can be undone */
/* muscle status */
.mrw{display:grid;grid-template-columns:86px 1fr 112px;align-items:center;gap:var(--s4);width:100%;padding:var(--s5) 0;border-top:1px solid var(--line);text-align:left}
.gh+.mrw{border-top:0}
.mrw .mn{font-size:var(--fs-body);font-weight:600}
.mrw .ml{font-size:var(--fs-sm);font-weight:700;text-align:right}
.sc2{position:relative;display:flex;height:8px;border-radius:var(--r1);background:var(--cell)}
.sc2 i{display:block;height:100%;background:color-mix(in srgb,var(--g) 38%,var(--cell))}
.sc2 i:first-child{border-radius:var(--r1) 0 0 var(--r1)}.sc2 i:last-of-type{border-radius:0 var(--r1) var(--r1) 0}
.sc2 b{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--tx);border:3px solid var(--card);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sc2.lg2{height:12px;border-radius:var(--r2)}.sc2.lg2 b{width:22px;height:22px}
.scl{position:relative;height:18px;margin-top:var(--s4);font:600 var(--fs-cap) var(--fd);color:var(--sub)}.scl span{position:absolute;transform:translateX(0)}
/* swipeable pages inside a sheet */
/* sheet entrance */
#sheet .ov.enter{animation:ovIn .28s ease both}
#sheet .ov.enter .pn{animation:sheetUp .46s cubic-bezier(.2,.9,.25,1) both}
#sheet .ov.pop.enter .pn{animation:popDown .38s cubic-bezier(.2,.9,.25,1) both}
@keyframes ovIn{from{opacity:0}}@keyframes sheetUp{from{transform:translateY(100%)}}@keyframes popDown{from{transform:translateY(-24px);opacity:0}}
@media(prefers-reduced-motion:reduce){#sheet .ov.in,#sheet .ov.enter .pn{animation:none}}
/* selected states: light blue in light mode, white in dark mode */
.dp.sel{background:var(--sel);color:var(--sel-t)}
.dp.sel b{color:var(--sel-t)}
.dp.sel .pl{background:radial-gradient(circle,var(--sel) 0 24%,var(--dc) 26%)}
.dp.td:not(.sel){box-shadow:inset 0 0 0 1.5px var(--acc)}
.seg button.on{background:var(--sel);color:var(--sel-t)}
.cp.on{background:var(--cc,var(--sel));color:var(--sel-t)}
.cp.col.on{color:var(--ct,var(--on-accent))}
.chs .cp.on{background:var(--sel);color:var(--sel-t)}
.mt.on,.opt-g .cell.on{background:var(--sel);color:var(--sel-t)}
.dots button.on::after{background:var(--dot)}
.dcol.now .dn{background:var(--sel);color:var(--sel-t)}
.pkb.on .chk,.pkb .chk.on{background:var(--acc);border-color:var(--acc)}
.sdots i.on{background:var(--acc)}
/* insights: the fade lives on an inner wrapper so scroll snapping stays exact */
.ins-s{padding:0;will-change:auto}
.ins-in{padding:var(--s6) var(--s6) var(--s3);will-change:opacity,transform}
/* volume summary */
.vsum{display:flex;align-items:baseline;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s5)}
.vsum b{font:800 var(--fs-xl) var(--fd);letter-spacing:-.02em}
.vsum span{font-size:var(--fs-body);color:var(--sub);font-weight:600}
/* swipe-to-remove */
.exbg span{transition:opacity .2s}
.exw.arm .exbg{filter:brightness(1.1)}
.exw.arm .exbg span{font-size:0}
.exw.arm .exbg span::after{content:"Release to remove";font-size:var(--fs-md)}
/* glass tab bar */
#view{padding-bottom:124px}
#toast{bottom:calc(var(--sab) + 96px)}
#tabs{position:absolute;left:0;right:0;bottom:0;display:block;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;border:0;padding:0 var(--s5) calc(var(--sab) + var(--s4));pointer-events:none;z-index:30}
.glass{pointer-events:auto;position:relative;display:flex;padding:var(--s3);border-radius:var(--r5);touch-action:none;user-select:none;-webkit-user-select:none;
 background:color-mix(in srgb,var(--card) 50%,transparent);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
 box-shadow:0 12px 34px rgba(0,0,0,.3),inset 0 0 0 1px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.35)}
:root[data-theme="light"] .glass{background:color-mix(in srgb,#fff 58%,transparent);box-shadow:0 10px 30px rgba(30,60,120,.18),inset 0 0 0 1px rgba(255,255,255,.85),inset 0 1px 0 #fff}
.lens{will-change:transform;position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:var(--r5);transform:translateX(calc(var(--i,0)*100%));
 transition:transform .55s cubic-bezier(.3,1.35,.45,1);pointer-events:none;
 background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.1));-webkit-backdrop-filter:blur(8px) saturate(220%) brightness(1.12);backdrop-filter:blur(8px) saturate(220%) brightness(1.12);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.42),inset 0 -8px 16px rgba(255,255,255,.1),0 4px 16px rgba(0,0,0,.2)}
:root[data-theme="light"] .lens{background:linear-gradient(180deg,rgba(0,122,255,.30),rgba(0,122,255,.12));box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),inset 0 -8px 16px rgba(255,255,255,.35),0 4px 14px rgba(0,122,255,.25)}
.glass.drag .lens{transition:none}
.glass .tb{position:relative;z-index:1;padding:var(--s4) 0 var(--s3);border-radius:var(--r5)}
.glass .tb:active{opacity:1}
:root[data-theme="light"] .tb.on{color:var(--sel)}
.glass .bd{top:3px;left:calc(50% + 6px)}
/* carousel: finger-following rail, one card per swipe, eased landing */
.ins-track{display:block;overflow:hidden;touch-action:pan-y;scroll-snap-type:none;scroll-behavior:auto;overscroll-behavior:auto;transition:height .35s cubic-bezier(.2,.8,.2,1)}
.ins-rail{display:flex;will-change:transform}
.ins-s{flex:0 0 100%;min-width:0;scroll-snap-align:none}
.ins-in{transition:opacity .45s ease}
.ins-rail.drag .ins-in{transition:none}
/* GLASS-SEG START */
.gseg{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.gseg .glens{position:absolute;top:3px;bottom:3px;left:0;border-radius:var(--r3);pointer-events:none;transition:transform .5s cubic-bezier(.3,1.3,.45,1),width .3s ease;
 background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.14));-webkit-backdrop-filter:blur(6px) saturate(200%);backdrop-filter:blur(6px) saturate(200%);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),inset 0 -6px 12px rgba(255,255,255,.1),0 3px 10px rgba(0,0,0,.18)}
:root[data-theme="light"] .gseg .glens{background:linear-gradient(180deg,rgba(0,122,255,.3),rgba(0,122,255,.12));box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 3px 10px rgba(0,122,255,.22)}
.gseg button{position:relative;z-index:1}
.gseg button.on,.gseg button.hot{background:none;color:var(--tx)}
:root[data-theme="light"] .gseg button.on,:root[data-theme="light"] .gseg button.hot{color:#007AFF}
.gseg.drag .glens{transition:none}
/* GLASS-SEG END */
/* insights: fixed box size, content centered vertically, optional bullet list */
.ins-track{transition:none}
.ins-s{display:flex;flex-direction:column;justify-content:center}
.ins-in{padding:var(--s5) var(--s6)}
.ins-in .bl{display:none}
.ins-in.ml .bp{display:none}
.ins-in.ml .bl{display:block}
.ins-in .bi{margin-top:0;color:var(--sub);font-size:var(--fs-body)}
.ins-in .bl ul{list-style:none;margin:var(--s3) 0 0;padding:0;display:flex;flex-direction:column;gap:var(--s3)}
.ins-in .bl li{position:relative;padding-left:var(--s6);font-size:var(--fs-body);line-height:1.35;color:var(--tx);font-weight:500}
.ins-in .bl li::before{content:"";position:absolute;left:3px;top:.52em;width:7px;height:7px;border-radius:50%;background:var(--bc,var(--sub))}
.ins-in .bn{margin-top:var(--s4);font-size:var(--fs-sm);color:var(--sub)}
.ins .dots{margin-top:0}
/* insights: category label matches the title size */
.ins .chipk{display:block;font:700 var(--fs-lg)/1.2 var(--fd);letter-spacing:-.01em;background:none;padding:0;border-radius:0}
.ins h3{margin:var(--s2) 0 var(--s2)}
/* insights: two-column bullets when a single column would be too tall */
.ins-in .bl ul.two{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows),auto);grid-template-columns:max-content minmax(0,1fr);column-gap:34px;row-gap:var(--s3)}
/* ready-to-increase is good news: green, not red */
.al{background:linear-gradient(145deg,color-mix(in srgb,var(--grn) 20%,var(--card)) 0%,var(--card) 68%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--grn) 32%,transparent)}
.al-ic{background:var(--grn);color:var(--on-g)}
.al .ar{border-top:1px solid color-mix(in srgb,var(--grn) 24%,var(--line))}
.al .more{color:var(--grn)}
.btn.grn{background:var(--grn)!important;color:var(--on-g)}
.cell.due .k,.cell.due .v,.cell.due .c{color:var(--grn)}
.cell.go{background:var(--grn);color:var(--on-g)}
.sc.due .k,.sc.due .v,.sc.due .v svg{color:var(--grn)}
.sc.go{background:var(--grn);color:var(--on-g)}
.bd{background:var(--grn);color:var(--on-g)}
/* save warning and section error tiles */
#savebar{display:none;position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:95;background:var(--warn-bg);color:var(--on-warn);border-radius:var(--r4);padding:var(--s5) var(--s5);font-size:var(--fs-sm);line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#savebar.on{display:flex;gap:var(--s4);align-items:center;flex-wrap:wrap}
#savebar .btn{background:rgba(0,0,0,.14)!important;color:var(--on-warn)}
.errt{border:1px dashed color-mix(in srgb,var(--warn) 60%,transparent)}
.errm{color:var(--red);font-size:var(--fs-sm);font-weight:600;margin:var(--s4) 0 0;text-align:center}
.warnstrip{color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,transparent)}
/* one-tap reps and effort row on a completed lift */
.qrow{display:flex;flex-direction:column;gap:var(--s4);padding:var(--s1) 0 var(--s5)}
.qrow .stp2{display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.qrow .stp2 .lab{font-size:var(--fs-sm);font-weight:600;color:var(--sub);flex:none}
.qrow .stp2 .ctl{display:flex;align-items:center;gap:var(--s3);flex:1;justify-content:flex-end;min-width:0}
.qrow .stp2 button{width:44px;height:44px;border-radius:var(--r4);background:var(--cell);font-size:var(--fs-lg);font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.qrow .stp2 b{flex:0 1 auto;min-width:0;padding:0 var(--s3);text-align:center;font:700 var(--fs-body) var(--fd);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s3)}
.qrow .chips button{height:44px;border-radius:var(--r3);background:var(--cell);font-size:var(--fs-cap);font-weight:600;color:var(--sub);white-space:nowrap;padding:0 var(--s1);display:flex;align-items:center;justify-content:center}
.qrow .chips button.on{background:var(--sel);color:var(--sel-t)}
/* heatmap legend */
.hm-leg{display:flex;align-items:center;gap:var(--s3);justify-content:flex-end;margin-top:var(--s4);font-size:var(--fs-cap);color:var(--sub)}
.hm-leg i{display:block;width:14px;height:14px;border-radius:var(--r1);background:var(--cell)}
.hm-leg i.l1{background:color-mix(in srgb,var(--tx) 28%,var(--cell))}.hm-leg i.l2{background:color-mix(in srgb,var(--tx) 58%,var(--cell))}.hm-leg i.l3{background:var(--tx)}
/* accessibility: visible keyboard focus, screen-reader-only text */
:focus-visible{outline:3px solid var(--sel);outline-offset:2px;border-radius:var(--r2)}
button:focus:not(:focus-visible),select:focus:not(:focus-visible){outline:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* people who ask for less motion get none: the tab lens, carousel, tile swipe and sheets just appear */
@media(prefers-reduced-motion:reduce){.lens,.glass,.ins-rail,.exw .ex,#sheet .ov,#sheet .ov .pn,.dcol .fl,.dots button::after{transition:none!important;animation:none!important}}

<script>
'use strict';
/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
/* the ONE date formatter. styles: md = Oct 3, dm = Sat, Oct 3, full = Saturday, Oct 3 */
const FMTD={md:{month:'short',day:'numeric'},dm:{weekday:'short',month:'short',day:'numeric'},full:{weekday:'long',month:'short',day:'numeric'}};
const FMTD_F=Object.fromEntries(Object.entries(FMTD).map(([k,o])=>[k,new Intl.DateTimeFormat('en-US',o)]));   // built once: creating a formatter per call was the slowest thing on the Stats screens
const fmtD=(s,style)=>FMTD_F[style].format(parse(s));
const trim=n=>String(Math.round(n*100)/100);
const weekStart=s=>addDays(s,-((parse(s).getDay()+6)%7));

/* ---------- constants ---------- */

const EQL={machine:'Machine',dumbbell:'Dumbbell',cable:'Cable',bodyweight:'Bodyweight',bar:'Pull-up bar',kettlebell:'Kettlebell',smith:'Smith machine',ball:'Ball'};
const BWEQ=['bodyweight','bar','ball'];
const U={lb:'lb',rep:'reps',sec:'sec'};

 push:{n:'Push',s:'Push',m:['chest','shoulders','triceps']},
 pull:{n:'Pull',s:'Pull',m:['back','rear','biceps']},

 lift:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>',

 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',

 info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 minus:'<path d="M5 12h14"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 up:'<path d="m18 15-6-6-6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',
 arrow:'<path d="M12 19V5M5 12l7-7 7 7"/>',
 spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17v4M17 19h4"/>',
 clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',

/* ---------- exercise library ----------
 [id,name,primary,[secondary],equip,kind(c|i),sets,reps,steps(|),tip,{u,inc,d}] */
const RAW=[
['chest_press','Chest press machine','chest',['triceps','shoulders'],'machine','c',3,'8-12','Set the seat so the handles sit at mid-chest.|Press out until your arms are nearly straight, elbows soft.|Return in 2 to 3 seconds without letting the stack touch.','Keep your shoulder blades pinned back against the pad.'],
['incline_machine_press','Incline chest press machine','chest',['shoulders','triceps'],'machine','c',3,'10','Adjust the seat so the handles line up with your upper chest.|Drive the handles up and slightly forward.|Lower slowly until you feel a light stretch across the chest.','Do not shrug. Keep your shoulders down and back.'],
['incline_db_press','Incline dumbbell press','chest',['shoulders','triceps'],'dumbbell','c',3,'10','Set the bench to a low incline, about 30 degrees.|Press the dumbbells up over your upper chest.|Lower to chest level with elbows about 45 degrees from your sides.','A low incline hits upper chest without turning into a shoulder press.'],
['flat_db_press','Flat dumbbell press','chest',['triceps','shoulders'],'dumbbell','c',3,'10','Lie flat with dumbbells at chest level and feet planted.|Press up until your arms are straight above your chest.|Lower with control until your upper arms are just below parallel.','Bring the dumbbells together at the top without clanking them.'],

['pec_deck','Pec deck fly','chest',['shoulders'],'machine','i',3,'12','Set the seat so the handles are at chest level.|Bring your arms together in front of you, elbows slightly bent.|Pause, then open slowly until you feel a stretch.','Lead with your elbows, not your hands.'],

/* ---------- build library ----------
 hold time (weeks at one weight) is fixed per exercise by type:
 lower-body compound 4, upper compound 3, machine/cable/Smith isolation 3, dumbbell/kettlebell isolation 4, bodyweight reps and holds 2 */
/* Hold time: how many clean weeks a lift stays at one weight before it is due to go up. First matching row wins. The explanation sheet shows these same rows. */
const HOLD=[
 {label:'Lower-body compounds (leg press, squats, lunges, deadlifts)',weeks:4,test:(u,k,p)=>u==='lb'&&k==='c'&&LEGM.has(p)},
 {label:'Upper-body compounds (presses, rows, pulldowns)',weeks:3,test:(u,k)=>u==='lb'&&k==='c'},
 {label:'Machine, cable and Smith isolation',weeks:3,test:(u,k,p,eq)=>u==='lb'&&(eq==='machine'||eq==='cable'||eq==='smith')},
 {label:'Dumbbell and kettlebell isolation',weeks:4,test:(u)=>u==='lb'},
 {label:'Bodyweight reps and holds',weeks:2,test:()=>true}];
const defWin=(u,k,p,eq)=>HOLD.find(r=>r.test(u,k,p,eq)).weeks;
const EX=RAW.map(r=>{const[id,name,p,s,eq,k,sets,reps,steps,tip,o]=r;const bw=eq==='bodyweight'||eq==='bar'||eq==='ball';const sec=o&&o.u==='sec';const u=sec?'sec':bw?'rep':'lb';
 const inc=(o&&o.inc)||(u==='sec'?5:u==='rep'?1:eq==='kettlebell'?5:k==='c'?(LEGM.has(p)&&(eq==='machine'||eq==='smith')?10:5):(eq==='machine'||eq==='cable'||eq==='smith')?5:2.5);
 return{id,name,p,s,eq,k,sets,reps,steps:steps.split('|'),tip,u,inc,win:(o&&o.win)||defWin(u,k,p,eq),d:!!(o&&o.d)};});
const E=Object.fromEntries(EX.map(e=>[e.id,e]));
if(EX.length!==Object.keys(E).length)console.error('duplicate exercise id');
const incTxt=id=>{const e=E[id],n=inc(id);return'+'+trim(n)+' '+(e.u==='rep'?(n===1?'rep':'reps'):e.u==='sec'?'sec':'lb');};

/* ---------- search: forgiving, and the ONE function every search box uses (Exercises tab, Add workout, Add to a list, routine setup) ----------
 It is forgiving about spaces and hyphens ("chestpress", "push ups"), plurals ("crunches"), a missed, doubled or swapped letter ("chess press", "cehst press"), and the words people use for a move the library names differently ("abs" is core, "db" is dumbbell).
 An exact match always ranks above a guess, and a guess is only made for words of 4 or more letters, so "row" never means "raw". */

/* ---------- consistency: weeks, not days. A week counts when it meets weekNeed (see CONSISTENCY). ---------- */
/* A week counts when you do at least weekNeed(planned days) of its planned workouts: all of them on a 1 or 2 day plan, and from 3 planned days at most missAllowed missed (and at least minShare done). The old 80% rule meant "all of them" for 4 or fewer planned days and "one miss allowed" for 5, an arbitrary cliff (finding B2). */

/* ---------- Home Screen (full screen) app on an iPhone: does the page stop short of the bottom of the screen? ----------
 A page that runs under the status bar (top inset above 20) should be as tall as the screen. When it is shorter, its bottom edge sits above the real one, and the home-bar space was counted below a page that already stops short of it. This is how much shorter, measured, never assumed.
 A page that starts BELOW the status bar (top inset 0, the "default" status bar style) is shorter by exactly the status bar and ends at the screen's bottom edge, so it is never short.
 Only the Home Screen app in portrait, and only a status-bar-sized gap (20 to 80), so a keyboard or a browser toolbar is never mistaken for it. */
const screenShortfall=(inner,screenH,standalone,portrait,top)=>{if(!standalone||!portrait||!Number.isFinite(inner)||!Number.isFinite(screenH)||!(top>=20))return 0;const d=screenH-inner;return d>=20&&d<=80?Math.round(d):0;};

/* ---------- Screen check (Settings): the real numbers behind the page height, as rows of [label, value] ----------
 m: inner [w,h], vv [h,top] or null, client [w,h], screen [w,h], outer [w,h], vh svh lvh dvh, top and bottom insets, standalone. Reading only: nothing is stored or changed. */
function screenRows(m){const wh=a=>a?a[0]+' x '+a[1]:'not available',d=m.screen[1]-m.inner[1];
 return[['Page (innerWidth x innerHeight)',wh(m.inner)],['Visible area (visualViewport)',m.vv?m.vv[0]+' tall, top '+m.vv[1]:'not available'],['Document (clientHeight)',wh(m.client)],['Screen (screen.width x height)',wh(m.screen)],['Window (outerWidth x outerHeight)',wh(m.outer)],
  ['100vh',String(m.vh)],['100svh',String(m.svh)],['100lvh',String(m.lvh)],['100dvh',String(m.dvh)],['Status bar inset (top)',String(m.top)],['Home bar inset (bottom)',String(m.bottom)],['Home Screen app',m.standalone?'yes':'no'],['Bottom space used by the page',m.sab==null?'not measured':String(m.sab)],['Viewport fix attempts',(m.fixes&&m.fixes.length)?m.fixes.join('; '):'none needed'],
  ['Page vs screen',d>0?d+' shorter':d<0?(-d)+' taller':'same height']];}

function offerUndo(label,key,pre){const now=Date.now(),keep=ui.undoKey===key&&ui.undoS===S&&now-ui.undoAt<4500&&ui.undoSnap;   // never reuse a snapshot taken before the data was replaced (restore, erase, demo)

function scrubOrder(pts){const ord=pts.map((_,i)=>i).sort((a,b)=>pts[a][0]-pts[b][0]);return{ord,sx:ord.map(i=>pts[i][0])};}
function nearestIdx(xs,x){let lo=0,hi=xs.length-1;if(hi<=0)return 0;if(x<=xs[0])return 0;if(x>=xs[hi])return hi;while(hi-lo>1){const mid=(lo+hi)>>1;if(xs[mid]<=x)lo=mid;else hi=mid;}return x-xs[lo]<=xs[hi]-x?lo:hi;}
function nearest2d(pts,x,y){let best=0,bd=Infinity;for(let i=0;i<pts.length;i++){const d=(pts[i][0]-x)**2+(pts[i][1]-y)**2;if(d<bd){bd=d;best=i;}}return best;}

 else h+=`<div class="cell"><span class="k">Expected increase</span><span class="v">${w?(st.date?fmtD(st.date,'dm'):'Not scheduled'):'Set a weight'}</span><span class="c">${w?(st.k==='hold'?'Missed reps last time':incTxt(id)):'to start tracking'}</span></div>`;

 if(ctx){const rc=rxCell(id,ctx.date,'Edit sets and reps');h+=`<button class="cell" data-act="sredit" data-id="${id}"><span class="k">Target</span><span class="v">${esc(rc.v)}</span><span class="c">${esc(rc.c)}</span></button>`;}

 h+=e.u==='lb'?`${ser.length?`<button class="cell" data-act="why" data-wk="lift" data-id="${id}" data-ww="e1rm">`:'<div class="cell">'}<span class="k">Estimated 1RM${ser.length?' '+ic('info','s'):''}</span><span class="v">${ser.length?Math.round(ser[ser.length-1][1])+' lb':'—'}</span><span class="c">Best weight ${best?trim(best)+' lb':'—'}</span>${ser.length?'</button>':'</div>'}`:`<div class="cell"><span class="k">Best</span><span class="v">${best?fmtW(id,best):'—'}</span><span class="c">Highest so far</span></div>`;

 h+=`<div class="cell" style="margin-top:8px"><span class="k" style="margin-bottom:8px">Jump size (${U[e.u]})</span><div class="seg">${(e.u==='lb'?[2.5,5,10]:e.u==='rep'?[1,2]:[5,10]).map(v=>`<button class="${inc(id)===v?'on':''}" data-act="incset" data-id="${id}" data-v="${v}">+${v}</button>`).join('')}</div></div>`;
 const o=S.w[id];if(o&&o.h.length>1){const lb=e.u==='lb';h+=`<div class="cell ch" style="margin-top:8px"><span class="k">${lb?'Weight':'Reps per set'} history</span><span class="c" style="margin:2px 0 6px">Each step is a day you changed ${lb?'the weight':'your reps'}. Press and drag across it.</span>${lineChart({pts:o.h,step:true,unit:lb?' lb':e.u==='rep'?' reps':' sec',label:lb?'Weight ':'Reps ',yt:lb?'Weight (lb)':e.u==='rep'?'Reps per set':'Seconds',xt:'Date'})}</div>`;}

 return head('Why am I seeing this?',w.tag)+blk(esc(w.t),w.b?`<p class="muted">${esc(w.b)}</p>`:'<p class="muted sm">This is what the number on the screen says.</p>')
 +blk('The numbers',rows.map(([k,x])=>`<div class="ref"><span>${esc(k)}</span><span>${esc(x)}</span></div>`).join(''))
 +(lines.length?blk('The lifts',lines.map(([k,x])=>`<div class="ref"><span>${esc(k)}</span><span>${esc(x)}</span></div>`).join('')):'')

function sheetLearn(s){const e=s.id?E[s.id]:null;
 if(s.k==='hold'){const rows=HOLD.map(r=>[r.label,r.weeks+' weeks']);
  return head('Why a hold time?',e.name+' stays at each weight for '+e.win+' weeks.')+`<div class="blk"><h3>How it works</h3><p class="muted">Strength builds when you repeat a weight until it feels solid. A week counts when you log this lift with all reps hit at your current weight. Skip a week and the next-increase date moves out by a week.</p></div><div class="blk"><h3>How your effort changes it</h3><p class="muted">The effort you rate a session can move the date. <b>Easy</b> means the weight is too light, so the lift is ready to go up now. <b>Moderate</b> makes it ready a week sooner than the hold time below. <b>Hard</b> and <b>Very hard</b> are the target, so they change nothing. Two sessions in a row at failure hold it one more week. Only sessions where you hit every rep count, and a planned lighter week is ignored.</p></div><div class="blk"><h3>Hold times</h3>${rows.map(r=>`<div class="ref"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>`;}
 const r=rmInfo(s.id),tr=r.tr,lbl=r.rep?'5RM Challenge':'1RM Challenge';
 return head(lbl+': '+e.name,'Why now and how to do it')
 +`<div class="blk"><h3>Why now</h3><div class="ref"><span>Weeks logged, last 10</span><span>${r.wks} of 10</span></div><div class="ref"><span>${r.since==null?'Previous challenge':'Last challenge'}</span><span>${r.since==null?'First one':r.since+' weeks ago'}</span></div><div class="ref"><span>Estimated 1RM</span><span>${Math.round(r.e1)} lb</span></div>${tr?`<div class="ref"><span>Strength trend</span><span>${tr.pct>=0?'+':''}${tr.pct.toFixed(1)}% in ${tr.weeks} wk</span></div>`:''}<div class="ref"><span>Last session</span><span>All reps hit</span></div></div>`
 +`<div class="blk"><h3>Your challenge</h3><p class="muted">${r.rep?'This lift uses dumbbells, so the challenge is the heaviest set of 5 you can do cleanly, near '+r.tgt+' lb. The app estimates your max from it.':'Work up to one clean rep near '+r.tgt+' lb. That is your target 1RM.'}</p></div>`

 +`<div class="stack"><button class="btn pri" data-act="rmlog" data-id="${s.id}">Log my result</button><button class="btn" data-act="rmsnooze" data-id="${s.id}">Not now</button></div>`;}
function sheetRmRes(s){const e=E[s.id];return head('Log your max',e.name)+`<div class="inrow"><input id="rmw" class="inp big" type="number" inputmode="decimal" step="any" placeholder="0"><input id="rmr" class="inp big" style="max-width:110px" type="number" inputmode="numeric" value="${s.rep?5:1}"></div><div class="muted sm" style="display:flex;justify-content:space-between;margin:8px 4px 16px"><span>pounds</span><span style="width:110px;text-align:center">reps</span></div><p class="muted sm" style="margin:0 4px">If you did more than 1 rep, the app calculates an estimated 1RM from it.</p><div class="ft"><button class="btn pri" data-act="rmsave">Save result</button></div>`;}

/* ---------- Try a new routine: the screens ----------
 The rules live in engine/trial.js. This file only draws the button, the trial card on Today, the start sheet and the two-column compare sheet, and turns taps and drags into those engine calls.
 Two ways into the compare sheet: "Edit days" while a trial runs (live edits, one trial day at a time) and "Compare routines" when it is over (old routine on the left, tried on the right, nothing changes until Finalize).
 Every drag has a tap alternative: the arrow copies a workout across and the x takes it out. The drag is a registered gesture, so the one gesture arbiter owns it. */
const TRY_OPTS={kind:[['day','A day'],['week','A week']],start:[['today','Today'],['tomorrow','Tomorrow']],from:[['copy','My routine'],['blank','Empty']]};
const TRY_LABEL={kind:'How long',start:'Starting',from:'Begin with'};
const TRY_FROM_NOTE={copy:'Every trial day begins as your usual routine.',blank:'Every trial day begins empty, so you can build it from scratch. Anything already checked off stays.'};
const tryWin=s=>{const a=s.start==='tomorrow'?addDays(iso(),1):iso();return{from:a,to:addDays(a,s.kind==='week'?6:0)};};
const tryNoun=t=>t.kind==='week'?'week':'day';

/* the top of the Today screen: a button, or the card for the trial that is running or over.
 Finishing early and reaching the last day end in the same card, so the question about what to do with the workouts is never skipped. */
function tryTop(){const t=tryCurrent();
 if(!t)return`<div class="t2 try-bar"><button class="try-b" data-act="tryopen">${ic('spark')}<span>Try a new routine</span></button></div>`;
 if(tryPhase(t)==='ended')return`<section class="tile t2 try-card"><h3>${t.endedAt?'Your trial has ended':'Your trial '+tryNoun(t)+' is over'}</h3><p class="muted sm">Did you like it? Choose what happens to these workouts.</p><div class="stack"><button class="btn pri" data-act="tryadd">Add these workouts to my routine</button><button class="btn" data-act="trycompare">Compare routines</button><button class="btn" data-act="tryyes">Replace my routine with the trial</button><button class="btn" data-act="tryno">No, keep my old routine</button></div></section>`;
 const n=tryDates(t).length,k=diffDays(iso(),t.start)+1,where=k<1?'Starts '+fmtD(t.start,'dm'):n===1?fmtD(t.start,'dm'):'Day '+k+' of '+n;
 return`<section class="tile t2 try-card"><h3>Trying a new routine</h3><div class="ex-s"><b>${esc(where)}</b></div><p class="muted sm try-note">Your usual routine, weights and history are untouched. Changes on these days are only for the trial. When it ends you choose what to keep.</p><div class="ft"><button class="btn" data-act="tryplan">Edit days</button><button class="btn" data-act="tryend">Finish trial</button></div></section>`;}

/* the start sheet */
const trySeg=(k,s)=>`<div class="seg try-seg" role="group" aria-label="${TRY_LABEL[k]}">${TRY_OPTS[k].map(([v,l])=>`<button class="${s[k]===v?'on':''}" data-act="tryset" data-k="${k}" data-v="${v}" aria-pressed="${s[k]===v}">${l}</button>`).join('')}</div>`;
function sheetTry(s){const w=tryWin(s),range=w.from===w.to?fmtD(w.from,'dm'):fmtD(w.from,'dm')+' to '+fmtD(w.to,'dm');
 return head('Try a new routine','Test a change without touching your routine')
  +`<div class="blk"><h3>${TRY_LABEL.kind}</h3>${trySeg('kind',s)}</div><div class="blk"><h3>${TRY_LABEL.start}</h3>${trySeg('start',s)}<p class="muted sm try-note">${esc(range)}</p></div><div class="blk"><h3>${TRY_LABEL.from}</h3>${trySeg('from',s)}<p class="muted sm try-note">${esc(TRY_FROM_NOTE[s.from])}</p></div>`

/* ---------- the compare sheet ----------
 The sheet object itself holds the state: {t:'cmp', mode:'plan'|'compare', i: day shown, days: (compare only) the plan for each date}. */
function cmpCtx(){const s=ui.sheet,t=tryCurrent();if(!s||s.t!=='cmp'||!t)return null;
 const plan=s.mode==='plan',all=tryCompareRows(t),rows=plan?all.filter(r=>r.date>=iso()):all;if(!rows.length)return null;
 const i=Math.max(0,Math.min(rows.length-1,s.i|0)),r=rows[i],st=plan?null:s.days[r.date];
 return{s,t,rows,i,r,plan,st,now:plan?r.tried:st.list,done:plan?doneSet(r.date):new Set()};}
/* one write path for both modes: a live trial day, or the plan held in the sheet */
function cmpPut(c,list){if(c.plan)trySetDay(c.r.date,list);else{c.st.list=list;c.st.use='new';}}
function cmpInsert(c,id,idx){if(c.now.includes(id))return;const l=c.now.slice();l.splice(idx==null?l.length:Math.min(idx,l.length),0,id);cmpPut(c,l);}
function cmpRemoveId(c,id){if(c.done.has(id)){toast(E[id].name+' is already checked off, so it stays.');return;}cmpPut(c,c.now.filter(x=>x!==id));}
function cmpReorder(c,id,idx){if(c.plan)return;const l=c.now.filter(x=>x!==id);l.splice(Math.min(idx,l.length),0,id);cmpPut(c,l);}
/* a drop: from the old column to the new one adds, from new to old removes, within the new column reorders (compare mode only, where order is kept) */
function cmpDrop(id,from,t){const c=cmpCtx();if(!c||!t||!E[id])return;
 if(from==='old'&&t.side==='new')cmpInsert(c,id,t.idx);else if(from==='new'&&t.side==='old')cmpRemoveId(c,id);else if(from==='new'&&t.side==='new')cmpReorder(c,id,t.idx);
 render();}
const cmpSame=c=>!c.plan&&c.r.base.length===c.st.list.length&&c.r.base.every(x=>c.st.list.includes(x));
function cmpItem(c,id,side){const e=E[id],inNew=c.now.includes(id);let act;
 if(side==='old')act=inNew?`<span class="ck" role="img" aria-label="Already in the trial">${ic('check')}</span>`:`<button class="ib" data-act="cmpadd" data-id="${id}" aria-label="Add ${esc(e.name)} to the trial">${ic('arrow')}</button>`;
 else act=c.done.has(id)?`<span class="ck" role="img" aria-label="Already checked off">${ic('check')}</span>`:`<button class="ib" data-act="cmprm" data-id="${id}" aria-label="Remove ${esc(e.name)} from the trial">${ic('x')}</button>`;
 return`<div class="ci" data-side="${side}" data-id="${id}"><span class="dh" aria-hidden="true"></span><div class="cn"><b>${esc(e.name)}</b><small>${MUSL[e.p]}</small></div>${act}</div>`;}
function sheetCmp(s){const c=cmpCtx();if(!c)return head('Trial','No trial is open.');
 const{r,plan,st,i,rows}=c,dn=DOW[r.dow],last=i===rows.length-1;
 const chips=rows.map((x,k)=>{const use=plan?null:s.days[x.date].use,lab=plan?parse(x.date).getDate():use==='new'?'new':'kept';
  return`<button class="dchip${k===i?' on':''}" data-act="cmpday" data-i="${k}" aria-pressed="${k===i}" aria-label="${DOW[x.dow]}, ${fmtD(x.date,'md')}${plan?'':use==='new'?', uses the tried routine':', keeps the old routine'}"><b>${DS[x.dow]}</b><span>${lab}</span></button>`;}).join('');
 const col=(cls,title,ids,side,empty)=>`<div class="cmp-col cmp-${cls}" data-side="${side}"><h4>${title}</h4>${ids.length?ids.map(id=>cmpItem(c,id,side)).join(''):`<p class="muted sm cmp-empty">${empty}</p>`}</div>`;
 const msg=plan?'Changes here apply to this trial day right away.':cmpSame(c)?'Nothing changed on '+dn+'.':st.use==='new'?'This becomes your routine for every '+dn+'.':dn+' keeps your old routine.';
 const btns=plan?`<div class="fr cmp-row"><button class="btn" data-act="cmpaddlib">${ic('plus')}Add a workout</button><button class="btn pri" data-act="cmpdone">Done</button></div>`
  :`<div class="fr cmp-row"><button class="btn" data-act="cmpmerge">Merge old into new</button><button class="btn" data-act="cmpskip">${st.use==='new'?'Skip: keep old':'Use tried'}</button></div><div class="fr cmp-row"><button class="btn" data-act="cmpback" ${i?'':'disabled'}>Back</button>${last?'<button class="btn pri" data-act="cmpfinal">Finalize</button>':'<button class="btn pri" data-act="cmpnext">Next</button>'}</div>`;

/* ---------- taps ---------- (ui/actions.js calls these through TRY_ACTIONS, the same way dev tools plug in) */
const TRY_ACTIONS={
 tryopen(){pushSheet({t:'try',kind:'week',start:'today',from:'copy'});},
 tryset(d){const s=ui.sheet;if(s&&s.t==='try'&&TRY_OPTS[d.k])s[d.k]=d.v;},

 tryend(){ask('Finish the trial now?','Nothing changes yet. Next you choose what to do with the workouts you tried.','Finish trial',()=>{tryEndNow();toast('Trial finished. Choose what to do with these workouts.');});},

 trycompare(){pushSheet({t:'cmp',mode:'compare',i:0,days:tryPlanDefaults(tryCurrent())});},
 tryyes(){ask('Replace your routine with the trial?','The days you changed take the trial\'s workouts in place of your old ones. A copy of your data is saved first.','Replace my routine',()=>{tryDecide('yes');toast('Your routine is updated.');});},
 tryno(){ask('Keep your old routine?','Your routine stays exactly as it was. The trial is closed.','No, keep my old routine',()=>{tryDecide('no');toast('Kept your old routine.');});},
 cmpday(d){const s=ui.sheet;if(s&&s.t==='cmp')s.i=+d.i;},
 cmpadd(d,id){const c=cmpCtx();if(c)cmpInsert(c,id);},

  askFrom(c.s,'Finalize your routine?',n?n+(n===1?' day becomes':' days become')+' part of your routine. The other days keep your old routine. A copy of your data is saved first.':'No day is set to change, so your routine stays as it is.','Finalize',()=>{tryFinalize(days);toast(n?'Your routine is updated.':'Your routine stays as it was.');});}

function viewportNudge(done){const meta=document.querySelector('meta[name=viewport]');if(!meta){if(done)done();return;}const old=meta.content;meta.content='width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1';setTimeout(()=>{meta.content=old;setTimeout(()=>{if(done)done();},300);},200);}

/* Keep sheets inside the part of the screen you can actually see. On an iPhone the keyboard covers the bottom of the screen WITHOUT resizing the page, so a bottom-anchored sheet used to sit behind it and the page got pushed around.
   vvFit publishes the visible area as --vvt (its top) and --vvh (its height), which the sheet overlay already reads. body.kb marks a text field being edited in a sheet, and folds the extras away (see the CSS). */
const vvFit=()=>{const v=window.visualViewport,r=document.documentElement.style;if(!v)return;r.setProperty('--vvt',v.offsetTop+'px');r.setProperty('--vvh',v.height+'px');};
const kbSet=on=>document.body.classList.toggle('kb',!!on),kbField=el=>!!(el&&el.matches&&el.matches('#sheet input:not([type=checkbox]):not([type=radio]):not([type=file]),#sheet textarea'));
if(window.visualViewport){visualViewport.addEventListener('resize',()=>{vvFit();if(window.innerHeight-visualViewport.height<80&&!kbField(document.activeElement))kbSet(false);});visualViewport.addEventListener('scroll',vvFit);vvFit();}
/* Home Screen app: if the page is shorter than the screen, drop the home-bar space (--sab) at once so the bottom bar sits at the bottom of what the phone does draw, then try these fixes one at a time, each at most once, to make the phone give the page its full height. Each one puts back whatever it touched. When the page is full height again, --sab goes back to the phone's own value.
   FIT.log keeps what each fix achieved, in words, for the Screen check. FIT.busy stops the resize a fix causes from starting the next one early. */
const FIT={step:0,log:[],cur:null,busy:false};
const FIXES=[
 ['viewport nudge',cb=>viewportNudge(cb)],
 ['forced reflow',cb=>{const b=document.body,d=b.style.display;b.style.display='none';void b.offsetHeight;b.style.display=d;setTimeout(cb,300);}],
 ['resize event',cb=>{window.dispatchEvent(new Event('resize'));setTimeout(cb,300);}],
 ['viewport tag replace',cb=>{const m=document.querySelector('meta[name=viewport]');if(!m){cb();return;}const c=m.cloneNode(),p=m.parentNode;p.replaceChild(c,m);setTimeout(()=>{p.replaceChild(m,c);setTimeout(cb,300);},200);}],
 ['status bar tag toggle',cb=>{const m=document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]');if(!m){cb();return;}const old=m.content;m.content='black-translucent';setTimeout(()=>{m.content=old;setTimeout(cb,300);},200);}]];
function fitViewport(){if(FIT.busy)return;
 const miss=screenShortfall(window.innerHeight,Math.max(screen.height||0,screen.width||0),navigator.standalone===true,window.innerHeight>window.innerWidth,insetTop()),r=document.documentElement.style;
 if(FIT.cur){FIT.log.push(FIT.cur+': '+(miss?'still '+miss+' short':'fixed'));FIT.cur=null;}
 if(!miss){r.removeProperty('--sab');return;}
 r.setProperty('--sab','0px');
 if(FIT.step<FIXES.length){const f=FIXES[FIT.step++];FIT.cur=f[0];FIT.busy=true;f[1](()=>{FIT.busy=false;fitViewport();});}}
window.addEventListener('resize',fitViewport);window.addEventListener('orientationchange',fitViewport);
fitViewport();
setTimeout(fitViewport,800);
let kbT;document.addEventListener('focusin',e=>{clearTimeout(kbT);if(kbField(e.target))kbSet(true);});
document.addEventListener('focusout',()=>{clearTimeout(kbT);kbT=setTimeout(()=>{if(!kbField(document.activeElement))kbSet(false);},120);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&iso()!==ui.today){ui.today=iso();ui.day=new Date().getDay();render();}});


/* ---------- resume where you left off ---------- */
const UIK='liftlog_ui';
function saveUI(){try{const v=$('#view');localStorage.setItem(UIK,JSON.stringify({tab:ui.tab,day:ui.day,dd:iso(),sc:v?v.scrollTop:0,st:ui.st,lib:{view:ui.lib.view,m:ui.lib.m,e:ui.lib.e},oo:ui.oo,ins:ui.ins}));}catch(e){}}
function loadUI(){try{const o=JSON.parse(localStorage.getItem(UIK)||'null');if(!o||S.setup==null)return;const same=o.dd===iso();ui.tab=VIEWS[o.tab]?o.tab:'today';if(same&&o.day!=null)ui.day=o.day;
 Object.assign(ui.st,o.st||{});Object.assign(ui.lib,o.lib||{});ui.oo=same?o.oo||null:null;ui.ins=Object.assign(ui.ins,o.ins||{});ui._sc=(ui.tab==='today'&&!same)?0:o.sc||0;}catch(e){}}
function restoreScroll(){if(!ui._sc)return;const v=$('#view'),y=ui._sc;requestAnimationFrame(()=>{v.scrollTop=y;requestAnimationFrame(()=>{v.scrollTop=y;setTimeout(()=>{v.scrollTop=y;},250);});});ui._sc=0;}
let svT;document.addEventListener('scroll',e=>{if(e.target&&e.target.id==='view'){clearTimeout(svT);svT=setTimeout(saveUI,400);}},true);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveUI();});window.addEventListener('pagehide',saveUI);window.addEventListener('beforeunload',saveUI);

/* ---------- backup files, catch-all error logging ---------- */
async function saveBackupFile(){const json=JSON.stringify(exportPayload(),null,1),name='lift-backup-'+iso()+'.json';
 try{const f=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Lift backup'});toast('Backup shared');return;}}catch(e){if(e&&e.name==='AbortError')return;}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast('Backup file saved');}catch(e){copyBackup();}}
document.addEventListener('change',e=>{const f=e.target;if(f&&f.id==='bkf'&&f.files&&f.files[0]){const rd=new FileReader();rd.onload=()=>{restoreFromText(String(rd.result||''));render();};rd.onerror=()=>toast('That file could not be read');rd.readAsText(f.files[0]);f.value='';}});
window.addEventListener('error',e=>logErr('Script',e.error||e.message));window.addEventListener('unhandledrejection',e=>logErr('Promise',e.reason));

/* ---------- offline: register the service worker when the app is served over http(s) and sw.js sits beside it. Anything else is silently skipped. ---------- */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});

/* ---------- home screen icon ---------- */
function makeIcon(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,180,180);
 g.addColorStop(0,'#26324a');g.addColorStop(1,'#111722');x.fillStyle=g;x.fillRect(0,0,180,180);x.strokeStyle='#F1F4F8';x.lineWidth=12;x.lineCap='round';
 const L=(a,b,c2,d)=>{x.beginPath();x.moveTo(a,b);x.lineTo(c2,d);x.stroke();};L(62,56,62,124);L(118,56,118,124);L(38,76,38,104);L(142,76,142,104);L(62,90,118,90);
 $('#ati').href=c.toDataURL('image/png');}catch(e){}}

/* ---------- start ---------- */
load();applyTheme();
loadUI();render();restoreScroll();makeIcon();
</script>
